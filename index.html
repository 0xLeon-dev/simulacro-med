<style>
:root{
  --bg:#f3f5f4; --paper:#ffffff; --ink:#15211e; --muted:#5b6964; --line:#d9e0dd; --chip:#e8eeec;
  --accent:#1f6b5a; --accent-ink:#ffffff; --accent-soft:#e3efeb;
  --ok:#1d7a46; --ok-soft:#e2f3e8; --bad:#b4372b; --bad-soft:#fbe7e4; --warn:#a55a0b; --warn-soft:#fbf0e1;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme=light]){
  --bg:#0f1513; --paper:#161e1b; --ink:#e4ece9; --muted:#93a39d; --line:#2a3632; --chip:#1f2a26;
  --accent:#5cc2a6; --accent-ink:#0b1311; --accent-soft:#1b2c27;
  --ok:#5ccf8c; --ok-soft:#16281e; --bad:#f08273; --bad-soft:#2e1a17; --warn:#f0b35c; --warn-soft:#2e2414; color-scheme:dark}}
:root[data-theme=dark]{
  --bg:#0f1513; --paper:#161e1b; --ink:#e4ece9; --muted:#93a39d; --line:#2a3632; --chip:#1f2a26;
  --accent:#5cc2a6; --accent-ink:#0b1311; --accent-soft:#1b2c27;
  --ok:#5ccf8c; --ok-soft:#16281e; --bad:#f08273; --bad-soft:#2e1a17; --warn:#f0b35c; --warn-soft:#2e2414; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:16px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand img{width:38px;height:38px;border-radius:10px;flex:0 0 auto}
.brand div{min-width:0}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);display:block}
h1{font-family:var(--display);font-weight:800;font-size:clamp(20px,6vw,26px);line-height:1.05;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{background:var(--chip);border-radius:99px;padding:4px 11px;font-size:13px;font-family:var(--mono);white-space:nowrap}
.packbar{display:flex;gap:8px;align-items:center;margin-top:12px}
.packbar select{flex:1;min-width:0}
nav{display:flex;gap:6px;overflow-x:auto;margin-top:12px;padding-bottom:4px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;padding:8px 13px;font-weight:500;border-radius:10px}
nav button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
main{padding-block:14px 60px;display:grid;gap:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;min-width:0}
h2{font-family:var(--display);font-weight:600;font-size:19px;margin:0;text-wrap:balance}
h3{font-size:15px;margin:0}
label{font-weight:500;font-size:13px}
input[type=text],input[type=search],textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;max-width:100%}
textarea{min-height:170px;resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:600;font-size:15px;border-radius:10px;padding:10px 14px;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.ok{background:var(--ok-soft);border-color:var(--ok)}
button.bad{background:var(--bad-soft);border-color:var(--bad)}
button.small{padding:6px 10px;font-size:13px;font-weight:500}
button.wide{width:100%}
button:disabled{opacity:.55;cursor:default}
.seg{display:flex;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px}
.seg button{flex:1;border:0;background:transparent;padding:8px}
.seg button[aria-selected=true]{background:var(--paper);box-shadow:0 1px 2px rgba(0,0,0,.08);color:var(--accent)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}.grid3 .field:last-child{grid-column:1/-1}}
.field{display:grid;gap:4px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:22px 14px;text-align:center;color:var(--muted);display:grid;gap:8px;justify-items:center}
.drop strong{color:var(--ink)}
.chip{font-family:var(--mono);font-size:12px;background:var(--accent-soft);color:var(--accent);padding:3px 9px;border-radius:99px;word-break:break-word;display:inline-block}
.hint,.muted{font-size:13px;color:var(--muted);margin:0}
.status{font-family:var(--mono);font-size:13px;color:var(--muted);min-height:1.4em;margin:0}
.status.err{color:var(--bad)}
.meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--chip);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.q{font-size:17px;font-weight:500;margin:0}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;font-weight:400;width:100%;background:var(--bg)}
.opt b{font-family:var(--mono);font-weight:500;color:var(--muted);min-width:1.2em}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.expl{border-left:3px solid var(--accent);padding:4px 0 4px 12px;margin:0}
.expl strong{display:block;font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.expl.ok strong{color:var(--ok)} .expl.no strong{color:var(--bad)}
.score{font-family:var(--display);font-weight:800;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.list{display:grid;margin:0;padding:0;list-style:none}
.list li{border-top:1px solid var(--line);padding-block:10px;font-size:14px}
.list .r{color:var(--ok);font-weight:500}
details.sec{border-top:1px solid var(--line);padding-top:10px}
details.sec:first-of-type{border-top:0;padding-top:0}
details.sec summary{cursor:pointer;font-weight:600;font-size:16px;list-style-position:outside}
details.sec ul{margin:8px 0 2px;padding-left:20px}
details.sec li{margin:6px 0}
.flash{min-height:210px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;cursor:pointer;font-size:19px;font-weight:500;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:22px;width:100%}
.flash.back{background:var(--accent-soft);font-size:17px;font-weight:400}
.trap{border-left:4px solid var(--warn);background:var(--warn-soft);border-radius:8px;padding:10px 12px;display:grid;gap:4px}
.trap b{font-weight:600}
.timer{font-family:var(--display);font-weight:800;font-size:72px;text-align:center;font-variant-numeric:tabular-nums;line-height:1;margin:6px 0}
.check{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line)}
.check:first-child{border-top:0}
.check input{margin-top:4px;width:20px;height:20px;flex:0 0 auto;accent-color:var(--accent)}
.check span{flex:1}
.check .m{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.done{color:var(--muted);text-decoration:line-through}
.stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat div{background:var(--bg);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.topic{display:grid;gap:4px}
.week{display:flex;gap:6px;align-items:flex-end;height:90px}
.week div{flex:1;display:grid;gap:4px;justify-items:center;font-family:var(--mono);font-size:11px;color:var(--muted)}
.week i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.empty{text-align:center;justify-items:center;padding:28px 16px}
.spinner{width:18px;height:18px;border:2px solid var(--accent-soft);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;display:inline-block;vertical-align:-4px;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}.spinner{animation:none}}
</style>

<body>
<div class="wrap">
  <header>
    <div class="brand"><img src="/icon-192.png" alt=""><div><span class="eyebrow">Tu repaso de medicina</span><h1>Simulacro Med</h1></div></div>
    <span class="pill" id="streak" title="Racha de días">🔥 0</span>
    <button class="small" id="themeBtn" aria-label="Cambiar tema claro u oscuro">🌓</button>
    <button class="small" id="install" hidden>Instalar</button>
  </header>
  <div class="packbar" id="packbar" hidden>
    <label for="packSel" class="hint">Materia</label>
    <select id="packSel"></select>
  </div>
  <nav id="nav" aria-label="Secciones"></nav>
  <main id="view"></main>
</div>
<input type="file" id="file" accept="image/*,application/pdf" hidden>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
/* ================= UTILIDADES ================= */
const $ = id => document.getElementById(id);
const L = "ABCDEFGH";
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } }
};
function esc(s){ const d=document.createElement("div"); d.textContent=String(s ?? ""); return d.innerHTML; }
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
const hoy = () => new Date().toLocaleDateString("en-CA");
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

/* ================= ESTADO ================= */
// packs: materias que subió el usuario. prog: avance por materia.
let packs = store.get("sm.packs", []);
let prog = store.get("sm.prog", {});
let actualId = store.get("sm.actual", null);
let tab = "apuntes";
let mode = "text", fileData = null, generando = false;
const pendienteQuiz = new Set();

// Pasa los simulacros de la versión 1 a materias para no perderlos
(function migrar(){
  const viejos = store.get("hist", null);
  if (!viejos || store.get("sm.migrado", false)) return;
  for (const h of viejos) {
    const nombres = [...new Set((h.preguntas||[]).map(q => q.tema || "General"))];
    const temas = nombres.map((n,i) => ({ id:"t"+(i+1), nombre:n }));
    packs.push({ id:h.id, titulo:h.titulo, creado:+h.id||Date.now(), temas, resumen:[], flashcards:[], trampas:[], plan:[], fuente:"",
      quiz:(h.preguntas||[]).map(q => ({ ...q, tema: temas[nombres.indexOf(q.tema||"General")].id })) });
  }
  store.set("sm.migrado", true); guardar();
})();

function guardar(){
  if (!store.set("sm.packs", packs)) toast("El celular no tiene espacio para guardar más. Borra alguna materia vieja.");
  store.set("sm.prog", prog); store.set("sm.actual", actualId);
}
const pack = () => packs.find(p => p.id === actualId) || null;
function P(){ // progreso de la materia actual
  const p = pack(); if (!p) return null;
  return prog[p.id] ||= { cards:{}, qs:{}, plan:{}, planDia:"" };
}
const nombreTema = (p, id) => (p.temas.find(t => t.id === id) || {}).nombre || "";
function marcarDia(){ const d = store.get("sm.dias", []); if (d[d.length-1] !== hoy()) { d.push(hoy()); store.set("sm.dias", d.slice(-400)); } pintarRacha(); }
function racha(){
  const d = new Set(store.get("sm.dias", [])); let n = 0; const f = new Date();
  if (!d.has(hoy())) f.setDate(f.getDate()-1);
  while (d.has(f.toLocaleDateString("en-CA"))) { n++; f.setDate(f.getDate()-1); }
  return n;
}
function pintarRacha(){ const n = racha(); $("streak").textContent = `🔥 ${n}`; $("streak").title = `Racha: ${n} ${n===1?"día":"días"} seguidos`; }
function toast(t){ const s = document.querySelector(".status"); if (s) { s.className="status err"; s.textContent=t; } else alert(t); }

/* ================= NAVEGACIÓN ================= */
const TABS = [
  ["apuntes","Apuntes"],["plan","Plan de hoy"],["foco","Foco"],["resumen","Resumen"],
  ["flash","Flashcards"],["quiz","Quiz"],["progreso","Progreso"],["trampas","Trampas"]
];
function pintarNav(){
  $("nav").innerHTML = TABS.map(([k,t]) => `<button data-t="${k}" class="${k===tab?"on":""}" ${k===tab?'aria-current="page"':""}>${t}</button>`).join("");
  $("nav").querySelectorAll("button").forEach(b => b.onclick = () => ir(b.dataset.t));
  const on = $("nav").querySelector(".on"); if (on) on.scrollIntoView({inline:"nearest", block:"nearest"});
}
function pintarPackbar(){
  $("packbar").hidden = !packs.length;
  $("packSel").innerHTML = packs.map(p => `<option value="${p.id}" ${p.id===actualId?"selected":""}>${esc(p.titulo)}</option>`).join("");
}
$("packSel").onchange = e => { actualId = e.target.value; guardar(); fc = null; qz = null; render(); };
function ir(t){ tab = t; pintarNav(); render(); window.scrollTo({top:0}); }
function render(){
  pintarPackbar();
  const V = { apuntes:vApuntes, plan:vPlan, foco:vFoco, resumen:vResumen, flash:vFlash, quiz:vQuiz, progreso:vProgreso, trampas:vTrampas }[tab];
  if (tab !== "apuntes" && tab !== "foco" && !pack()) return vVacio();
  V();
}
function vVacio(){
  $("view").innerHTML = `<section class="card empty"><h2>Todavía no hay material</h2>
    <p class="muted">Sube tus apuntes, una foto o un PDF del tema y la app arma el resumen, las flashcards, el quiz, las trampas y tu plan de hoy.</p>
    <button class="primary" id="goUp">Subir apuntes</button></section>`;
  $("goUp").onclick = () => ir("apuntes");
}

/* ================= APUNTES (crear material) ================= */
function vApuntes(){
  const p = pack();
  $("view").innerHTML = `
  <section class="card" aria-labelledby="h-up">
    <h2 id="h-up">Nueva materia</h2>
    <div class="seg" role="tablist">
      <button role="tab" id="tab-text" aria-selected="${mode==="text"}">Pegar texto</button>
      <button role="tab" id="tab-file" aria-selected="${mode==="file"}">Foto o PDF</button>
    </div>
    <div id="pane-text" ${mode!=="text"?"hidden":""}><textarea id="notes" aria-label="Apuntes" placeholder="Pega aquí el tema que quieres estudiar…"></textarea></div>
    <div id="pane-file" ${mode!=="file"?"hidden":""}>
      <div class="drop"><strong>Sube una foto de tus apuntes o un PDF</strong>
        <span class="hint">PDF de hasta 3 MB. Si es un libro, sube solo las páginas del tema.</span>
        <button id="pick">Elegir archivo</button>
        <span id="fileName" class="chip" ${fileData?"":"hidden"}>${esc(fileData?.name||"")}</span></div>
    </div>
    <div class="grid3">
      <div class="field"><label for="count">Preguntas</label>
        <select id="count"><option>10</option><option selected>15</option><option>20</option></select></div>
      <div class="field"><label for="style">Tipo</label>
        <select id="style"><option value="mixto">Mixto</option><option value="caso">Casos clínicos</option><option value="directa">Directas</option></select></div>
      <div class="field"><label for="level">Dificultad</label>
        <select id="level"><option value="básica">Básica</option><option value="intermedia" selected>Intermedia</option><option value="alta">Alta</option></select></div>
    </div>
    <div class="field"><label for="code">Código de acceso</label>
      <input type="text" id="code" autocomplete="off" autocapitalize="characters" placeholder="Si tienes uno, escríbelo aquí"></div>
    <button class="primary wide" id="gen" ${generando?"disabled":""}>Crear material de estudio</button>
    <p class="status" id="status" role="status">${generando?'<span class="spinner"></span>Armando tu material… puede tardar hasta 1 minuto':""}</p>
  </section>
  ${packs.length ? `<section class="card" aria-labelledby="h-mis">
    <div class="row between"><h2 id="h-mis">Mis materias</h2><button class="small" id="imp">Importar</button></div>
    <ul class="list">${packs.map(x => `<li class="row between"><button class="small" data-open="${x.id}" style="border:0;padding:0;background:none;text-align:left;font-weight:${x.id===actualId?600:500}">${esc(x.titulo)}</button>
      <span class="row"><span class="muted">${x.flashcards.length} tarjetas · ${x.quiz.length} preg.</span>
      <button class="small" data-exp="${x.id}" aria-label="Compartir ${esc(x.titulo)}">Compartir</button>
      <button class="small" data-del="${x.id}" aria-label="Borrar ${esc(x.titulo)}">Borrar</button></span></li>`).join("")}</ul>
    <p class="hint">Con «Compartir» mandas la materia a un amigo por WhatsApp; él la abre con «Importar» sin gastar su límite.</p>
  </section>` : `<section class="card"><div class="row between"><p class="muted">¿Un amigo te pasó una materia?</p><button class="small" id="imp">Importar</button></div></section>`}`;

  $("notes").value = store.get("notes", "");
  $("code").value = store.get("code", "");
  $("notes").oninput = () => store.set("notes", $("notes").value);
  $("code").oninput = () => store.set("code", $("code").value);
  $("tab-text").onclick = () => { mode="text"; vApuntes(); };
  $("tab-file").onclick = () => { mode="file"; vApuntes(); };
  $("pick").onclick = () => $("file").click();
  $("gen").onclick = generar;
  $("imp").onclick = () => $("importFile").click();
  document.querySelectorAll("[data-open]").forEach(b => b.onclick = () => { actualId = b.dataset.open; guardar(); ir("resumen"); });
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    const x = packs.find(k => k.id === b.dataset.del);
    if (!confirm(`¿Borrar «${x.titulo}» y su progreso?`)) return;
    packs = packs.filter(k => k !== x); delete prog[x.id];
    if (actualId === x.id) actualId = packs[0]?.id || null;
    guardar(); vApuntes();
  });
  document.querySelectorAll("[data-exp]").forEach(b => b.onclick = () => exportar(packs.find(k => k.id === b.dataset.exp)));
}

// Las fotos se reducen en el celular para que suban rápido
function compressImage(file){
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1600, s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      resolve({ data: c.toDataURL("image/jpeg", 0.82).split(",")[1], mime: "image/jpeg", name: file.name });
    };
    img.onerror = () => reject(new Error("No se pudo leer la imagen."));
    img.src = url;
  });
}
function readBase64(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve({ data: String(r.result).split(",")[1], mime: file.type, name: file.name });
    r.onerror = () => reject(new Error("No se pudo leer el archivo."));
    r.readAsDataURL(file);
  });
}
$("file").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  const st = $("status"); if (st) { st.className = "status"; st.textContent = ""; }
  try {
    if (f.type === "application/pdf") {
      if (f.size > 3*1024*1024) throw new Error("El PDF pesa más de 3 MB. Sube solo las páginas del tema.");
      fileData = await readBase64(f);
    } else if (f.type.startsWith("image/")) fileData = await compressImage(f);
    else throw new Error("Ese tipo de archivo no se puede usar. Sube una foto o un PDF.");
    vApuntes();
  } catch(err){ fileData = null; vApuntes(); toast(err.message); }
};

async function llamar(body){
  const r = await fetch("/api/generar", { method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ ...body, codigo: store.get("code", "") }) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || "No se pudo generar. Revisa tu internet e intenta de nuevo.");
  return data;
}
// Texto que se usa como fuente para pedir más preguntas sin volver a subir el archivo
function fuenteDe(p){
  if (p.fuente) return p.fuente;
  return p.resumen.map(r => `## ${r.titulo}\n` + r.puntos.map(x => "- " + x.replace(/\*\*/g,"")).join("\n")).join("\n\n")
    + "\n\n" + p.flashcards.map(c => `${c.frente}: ${c.reverso}`).join("\n");
}

async function generar(){
  const texto = mode==="text" ? $("notes").value.trim() : "";
  if (mode==="text" && texto.length < 80) return toast("Pega un poco más de apuntes (al menos un párrafo).");
  if (mode==="file" && !fileData) return toast("Primero elige una foto o PDF.");
  const cfg = { n: $("count").value, tipo: $("style").value, nivel: $("level").value };
  generando = true; vApuntes();
  try {
    const { estudio } = await llamar({ modo:"estudio", texto, archivo: mode==="file"?fileData.data:undefined, mime: mode==="file"?fileData.mime:undefined });
    const p = { id: String(Date.now()), creado: Date.now(), ...estudio, quiz: [], cfg, fuente: texto.slice(0, 60000) };
    packs.unshift(p); actualId = p.id; guardar();
    generando = false; fileData = null; fc = null; qz = null; marcarDia();
    ir("resumen");
    pedirQuiz(p, cfg);
  } catch(err){ generando = false; if (tab === "apuntes") { vApuntes(); toast(err.message); } else alert(err.message); }
}

async function pedirQuiz(p, cfg){
  pendienteQuiz.add(p.id); if (tab === "quiz") render();
  try {
    const { preguntas } = await llamar({ modo:"quiz", texto: fuenteDe(p), temas: p.temas, n: cfg.n, tipo: cfg.tipo, nivel: cfg.nivel,
      hechas: p.quiz.map(q => q.pregunta) });
    p.quiz.push(...preguntas); p.quizError = ""; guardar(); qz = null;
  } catch(err){ p.quizError = err.message; }
  pendienteQuiz.delete(p.id);
  if (tab === "quiz" || tab === "apuntes") render();
}

function exportar(p){
  const blob = new Blob([JSON.stringify({ simulacroMed: 2, materia: { ...p, fuente: undefined } })], { type:"application/json" });
  const nombre = p.titulo.toLowerCase().normalize("NFD").replace(/[^\w]+/g,"-").replace(/^-|-$/g,"") + ".simulacro.json";
  const file = new File([blob], nombre, { type:"application/json" });
  if (navigator.canShare && navigator.canShare({ files:[file] })) navigator.share({ files:[file], title:p.titulo }).catch(()=>{});
  else { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nombre; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000); }
}
$("importFile").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const d = JSON.parse(await f.text()); const m = d?.materia;
    if (!m || !Array.isArray(m.temas) || !Array.isArray(m.resumen)) throw 0;
    const p = { id:String(Date.now()), creado:Date.now(), titulo:String(m.titulo||"Materia"), temas:m.temas, resumen:m.resumen,
      flashcards:m.flashcards||[], trampas:m.trampas||[], plan:m.plan||[], quiz:m.quiz||[], cfg:m.cfg||{n:15,tipo:"mixto",nivel:"intermedia"}, fuente:"" };
    packs.unshift(p); actualId = p.id; fc = null; qz = null; guardar(); ir("resumen");
  } catch { alert("Ese archivo no es una materia de Simulacro Med."); }
};

function vPlan(){
  const p = pack(), pr = P();
  if (pr.planDia !== hoy()) { pr.plan = {}; pr.planDia = hoy(); guardar(); }
  const pendientes = p.flashcards.filter((c,i) => pr.cards[i] !== 2).length;
  const debil = temasDebiles(p).find(t => t.dominio < 1);
  const auto = [];
  if (pendientes) auto.push({ k:"a1", tarea:`Pasa tus ${pendientes} flashcards pendientes`, minutos: Math.max(5, Math.round(pendientes/3)), ir:"flash" });
  if (debil) auto.push({ k:"a2", tarea:`Quiz de tu tema más flojo: ${nombreTema(p, debil.id)}`, minutos:10, ir:"quiz", tema:debil.id });
  if (p.trampas.length) auto.push({ k:"a3", tarea:"Lee las trampas antes de cerrar", minutos:5, ir:"trampas" });
  const items = [...p.plan.map((x,i) => ({ ...x, k:"p"+i })), ...auto];

  $("view").innerHTML = `
  <section class="card">
    <div class="row between"><h2>Plan de hoy</h2><span class="chip">${hechos}/${items.length} · ~${total} min</span></div>

    <div>${items.map(x => `<label class="check"><input type="checkbox" data-k="${x.k}" ${pr.plan[x.k]?"checked":""}>
      <span class="${pr.plan[x.k]?"done":""}">${md(x.tarea)}</span><span class="m">${x.minutos} min</span>
      ${x.ir?`<button class="small" data-ir="${x.ir}" data-tema="${x.tema||""}">Ir</button>`:""}</label>`).join("")}</div>
    <button class="primary" id="goFoco">Empezar bloque de foco</button>

  $("view").querySelectorAll("input[data-k]").forEach(c => c.onchange = () => { pr.plan[c.dataset.k] = c.checked; if (c.checked) marcarDia(); guardar(); vPlan(); });

/* ================= FOCO ================= */
const foco = store.get("sm.focoCfg", { trabajo:25, descanso:5 });
let ft = { fase:"trabajo", fin:0, resta: foco.trabajo*60, corre:false, id:null };
function vFoco(){
  const min = store.get("sm.foco", {})[hoy()] || 0;
  $("view").innerHTML = `
  <section class="card">
    <div class="row between"><h2>${ft.fase==="trabajo"?"Bloque de estudio":"Descanso"}</h2><span class="chip">Hoy: ${min} min</span></div>
    <div class="timer" id="clock" role="timer" aria-live="off"></div>
    <div class="row" style="justify-content:center">
      <button class="primary" id="fPlay">${ft.corre?"Pausar":"Empezar"}</button>
      <button id="fReset">Reiniciar</button>
      <button id="fSkip">${ft.fase==="trabajo"?"Ir a descanso":"Volver a estudiar"}</button>
    </div>
    <div class="seg" role="group" aria-label="Duración">
      ${[[25,5],[50,10],[15,3]].map(([a,b]) => `<button data-t="${a}" data-d="${b}" aria-selected="${foco.trabajo===a}">${a} / ${b}</button>`).join("")}
    </div>
    <p class="hint">Deja el celular boca abajo. Al terminar suena una alarma y los minutos se suman a tu progreso.</p>
  </section>`;
  pintarReloj();
  $("fPlay").onclick = () => { ft.corre ? pausar() : arrancar(); vFoco(); };
  $("fReset").onclick = () => { pausar(); ft.resta = (ft.fase==="trabajo"?foco.trabajo:foco.descanso)*60; vFoco(); };
  $("fSkip").onclick = () => { pausar(); cambiarFase(); vFoco(); };
  $("view").querySelectorAll("[data-t]").forEach(b => b.onclick = () => {
    foco.trabajo = +b.dataset.t; foco.descanso = +b.dataset.d; store.set("sm.focoCfg", foco);
    pausar(); ft.fase = "trabajo"; ft.resta = foco.trabajo*60; vFoco();
  });
}
function pintarReloj(){
  const s = ft.corre ? Math.max(0, Math.round((ft.fin - Date.now())/1000)) : ft.resta;
  const t = `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
  if ($("clock")) $("clock").textContent = t;
  document.title = ft.corre ? `${t} · ${ft.fase==="trabajo"?"Estudiando":"Descanso"}` : "Simulacro Med";
  return s;
}
function arrancar(){ ft.fin = Date.now() + ft.resta*1000; ft.corre = true; ft.id = setInterval(tick, 500); }
function pausar(){ if (ft.corre) ft.resta = Math.max(0, Math.round((ft.fin - Date.now())/1000)); ft.corre = false; clearInterval(ft.id); pintarReloj(); }
function tick(){
  if (pintarReloj() > 0) return;
  pausar();
  if (ft.fase === "trabajo") { const f = store.get("sm.foco", {}); f[hoy()] = (f[hoy()]||0) + foco.trabajo; store.set("sm.foco", f); marcarDia(); }
  alarma(); cambiarFase(); if (tab === "foco") vFoco();
}
function cambiarFase(){ ft.fase = ft.fase==="trabajo" ? "descanso" : "trabajo"; ft.resta = (ft.fase==="trabajo"?foco.trabajo:foco.descanso)*60; }
function alarma(){
  try { navigator.vibrate?.([300,150,300]); } catch {}
  try {
    const ac = new (window.AudioContext||window.webkitAudioContext)();
    [0,.35,.7].forEach(t => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = 880; o.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(.25, ac.currentTime+t); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime+t+.3); o.start(ac.currentTime+t); o.stop(ac.currentTime+t+.3); });
  } catch {}
}

    <div class="row between"><button id="again">Otra ronda</button><button id="share">Compartir resultado</button></div>`;

/* ================= PROGRESO ================= */
function temasDebiles(p){
  const pr = prog[p.id] || { cards:{}, qs:{} };
  return p.temas.map(t => {
    const cs = p.flashcards.map((c,i) => [c,i]).filter(([c]) => c.tema === t.id);
    const qs = p.quiz.map((q,i) => [q,i]).filter(([q]) => q.tema === t.id);
    const resp = qs.filter(([,i]) => pr.qs[i]);
    const pc = cs.length ? cs.filter(([,i]) => pr.cards[i] === 2).length / cs.length : null;
    const pq = resp.length ? resp.filter(([,i]) => pr.qs[i].ok).length / resp.length : null;
    const partes = [pc, pq].filter(v => v !== null);
    return { id:t.id, nombre:t.nombre, pc, pq, nq:resp.length, dominio: partes.length ? partes.reduce((a,b)=>a+b,0)/partes.length : 0 };
  }).sort((a,b) => a.dominio - b.dominio);
}
function vProgreso(){
  const p = pack(), pr = P();
  const sabe = p.flashcards.filter((c,i) => pr.cards[i] === 2).length;
  const resp = Object.keys(pr.qs).filter(i => p.quiz[i]);
  const acierto = resp.length ? Math.round(resp.filter(i => pr.qs[i].ok).length / resp.length * 100) : 0;
  const f = store.get("sm.foco", {});
  const dias = [...Array(7)].map((_,k) => { const d = new Date(); d.setDate(d.getDate()-6+k); const key = d.toLocaleDateString("en-CA"); return { l: d.toLocaleDateString("es",{weekday:"narrow"}), m: f[key]||0 }; });
  const maxM = Math.max(25, ...dias.map(d => d.m));
  const temas = temasDebiles(p);
  $("view").innerHTML = `
  <section class="card">
    <h2>Progreso · ${esc(p.titulo)}</h2>
    <div class="stat">
      <div><b>${p.flashcards.length?Math.round(sabe/p.flashcards.length*100):0}%</b><span>flashcards dominadas</span></div>
      <div><b>${acierto}%</b><span>aciertos (${resp.length} resp.)</span></div>
      <div><b>${racha()}</b><span>días de racha</span></div>
    </div>
  </section>
  <section class="card">
    <h2>Dominio por tema</h2>
    ${temas.slice().sort((a,b) => p.temas.findIndex(t=>t.id===a.id) - p.temas.findIndex(t=>t.id===b.id)).map(t => `<div class="topic">
      <div class="meta"><span style="color:var(--ink);font-family:var(--body);font-size:14px">${esc(t.nombre)}</span><span>${Math.round(t.dominio*100)}%</span></div>
      <div class="bar"><i style="width:${Math.round(t.dominio*100)}%"></i></div>
      <span class="hint">${t.pc!==null?`Tarjetas ${Math.round(t.pc*100)}%`:"Sin tarjetas"} · ${t.pq!==null?`Quiz ${Math.round(t.pq*100)}% (${t.nq})`:"Quiz sin hacer"}</span></div>`).join("")}
    ${temas[0] && temas[0].dominio < 1 ? `<p class="hint">Tu tema más flojo ahora: <b>${esc(temas[0].nombre)}</b>.</p>` : ""}
  </section>
  <section class="card">
    <div class="row between"><h2>Minutos de foco · 7 días</h2><span class="chip">${dias.reduce((s,d)=>s+d.m,0)} min</span></div>
    <div class="week" role="img" aria-label="Minutos de foco por día en la última semana">${dias.map(d => `<div><span>${d.m||""}</span><i style="height:${Math.round(d.m/maxM*60)}px"></i><span>${d.l}</span></div>`).join("")}</div>
  </section>
  <section class="card"><div class="row between"><p class="muted">¿Quieres empezar de cero esta materia?</p><button class="small bad" id="resetP">Reiniciar progreso</button></div></section>`;
  $("resetP").onclick = () => { if (confirm("Se borran tus marcas de flashcards y respuestas de esta materia.")) { prog[p.id] = { cards:{}, qs:{}, plan:{}, planDia:"" }; guardar(); fc = null; qz = null; vProgreso(); } };
}

/* ================= TRAMPAS ================= */
function vTrampas(){
  const p = pack();
  $("view").innerHTML = `
  <section class="card">
    <h2>Trampas de examen</h2>
    <p class="hint">Las confusiones que más hacen fallar. Léelas justo antes del examen.</p>
    ${p.trampas.length ? p.trampas.map(t => `<div class="trap"><b>${md(t.confusion)}</b><span>${md(t.clave)}</span><span class="hint">${esc(nombreTema(p, t.tema))}</span></div>`).join("")
      : `<p class="muted">Esta materia no tiene trampas. Crea una nueva con tus apuntes.</p>`}
  </section>`;
}

/* ================= TEMA E INSTALACIÓN ================= */
const tema0 = store.get("theme", null); if (tema0) document.documentElement.setAttribute("data-theme", tema0);
$("themeBtn").onclick = () => {
  const actual = document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const n = actual === "dark" ? "light" : "dark"; document.documentElement.setAttribute("data-theme", n); store.set("theme", n);
};
let deferred = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; $("install").hidden = false; });
$("install").onclick = async () => { if (!deferred) return; deferred.prompt(); await deferred.userChoice; deferred = null; $("install").hidden = true; };
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(()=>{});

if (pack()) tab = "plan"; else if (packs.length) { actualId = packs[0].id; tab = "plan"; }
pintarNav(); pintarRacha(); render();
</script>
</body>
</html>
